<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-label="One tool, every route into DLSS 5">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0f13"/>
      <stop offset="1" stop-color="#141821"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'DejaVu Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif; }
    .h    { font-weight: 800; letter-spacing:-0.3px; }
    .rt   { font-weight: 700; letter-spacing:0.2px; }
    .desc { font-weight: 400; }
    .who  { font-weight: 600; letter-spacing:0.2px; }
    .flag { font-weight: 700; letter-spacing:0.4px; }
  </style>

  <rect x="4" y="4" width="1272" height="462" rx="22" fill="url(#bg2)" stroke="#262a33" stroke-width="1.5"/>

  <text x="40" y="58" class="h" font-size="30" fill="#e8e9ec">One tool, every route into DLSS 5</text>
  <text x="41" y="88" class="desc" font-size="16" fill="#7d8592">The tool reads the executable and your card, then picks the path that fits — and greys out what your card can't run.</text>

  <!-- card template: 396 x 150, 3 columns -->
  <!-- row 1 -->
  <g transform="translate(40,116)">
    <rect width="386" height="150" rx="14" fill="#15181e" stroke="#2a2f39"/>
    <rect width="4" height="150" rx="2" fill="#7fb2ff"/>
    <text x="24" y="42" class="rt" font-size="20" fill="#e8e9ec">OptiScaler</text>
    <g transform="translate(300,26)"><rect width="66" height="24" rx="6" fill="#132015" stroke="#2e5a34"/><text x="33" y="16" class="flag" font-size="11" fill="#8fe39a" text-anchor="middle">ROBUST</text></g>
    <text x="24" y="74" class="desc" font-size="14.5" fill="#9aa1ad">Replaces the upscaler and runs the</text>
    <text x="24" y="94" class="desc" font-size="14.5" fill="#9aa1ad">model over its output. No ReShade.</text>
    <text x="24" y="128" class="who" font-size="13" fill="#7d8592">64-bit D3D11/12 with DLSS · most stable here</text>
  </g>
  <g transform="translate(447,116)">
    <rect width="386" height="150" rx="14" fill="#15181e" stroke="#2a2f39"/>
    <rect width="4" height="150" rx="2" fill="#c4c9d2"/>
    <text x="24" y="42" class="rt" font-size="20" fill="#e8e9ec">ReShade add-on</text>
    <text x="24" y="74" class="desc" font-size="14.5" fill="#9aa1ad">RenoDX's add-on hooks the DLSS</text>
    <text x="24" y="94" class="desc" font-size="14.5" fill="#9aa1ad">calls the game already makes.</text>
    <text x="24" y="128" class="who" font-size="13" fill="#7d8592">64-bit D3D12 with DLSS</text>
  </g>
  <g transform="translate(854,116)">
    <rect width="386" height="150" rx="14" fill="#15181e" stroke="#2a2f39"/>
    <rect width="4" height="150" rx="2" fill="#c4c9d2"/>
    <text x="24" y="42" class="rt" font-size="20" fill="#e8e9ec">DX11 bridge</text>
    <text x="24" y="74" class="desc" font-size="14.5" fill="#9aa1ad">Mirrors the game's DLSS onto a</text>
    <text x="24" y="94" class="desc" font-size="14.5" fill="#9aa1ad">private D3D12 session (vkd3d-proton).</text>
    <text x="24" y="128" class="who" font-size="13" fill="#7d8592">D3D11 &amp; Vulkan with DLSS · Baldur's Gate 3</text>
  </g>

  <!-- row 2 -->
  <g transform="translate(40,290)">
    <rect width="386" height="150" rx="14" fill="#15181e" stroke="#2a2f39"/>
    <rect width="4" height="150" rx="2" fill="#c4c9d2"/>
    <text x="24" y="42" class="rt" font-size="20" fill="#e8e9ec">Feeder — DLAA</text>
    <text x="24" y="74" class="desc" font-size="14.5" fill="#9aa1ad">Builds a DLAA contract from ReShade's</text>
    <text x="24" y="94" class="desc" font-size="14.5" fill="#9aa1ad">depth buffer and shader motion vectors.</text>
    <text x="24" y="128" class="who" font-size="13" fill="#7d8592">Games with no DLSS · D3D10/11/12, Vulkan, 32-bit</text>
  </g>
  <g transform="translate(447,290)">
    <rect width="386" height="150" rx="14" fill="#15181e" stroke="#2a2f39"/>
    <rect width="4" height="150" rx="2" fill="#a98bff"/>
    <text x="24" y="42" class="rt" font-size="20" fill="#e8e9ec">RTX Remix</text>
    <text x="24" y="74" class="desc" font-size="14.5" fill="#9aa1ad">DLSS 5 runs inside the Remix runtime.</text>
    <text x="24" y="94" class="desc" font-size="14.5" fill="#9aa1ad">Nothing injected — one line in rtx.conf.</text>
    <text x="24" y="128" class="who" font-size="13" fill="#7d8592">Any game with a .trex folder · Portal RTX, GTA IV</text>
  </g>
  <g transform="translate(854,290)">
    <rect width="386" height="150" rx="14" fill="#15181e" stroke="#2a2f39"/>
    <rect width="4" height="150" rx="2" fill="#f0b45c"/>
    <text x="24" y="42" class="rt" font-size="20" fill="#e8e9ec">Neural Upstream</text>
    <g transform="translate(250,26)"><rect width="116" height="24" rx="6" fill="#241d12" stroke="#5a4a22"/><text x="58" y="16" class="flag" font-size="11" fill="#f0b45c" text-anchor="middle">EXPERIMENTAL</text></g>
    <text x="24" y="74" class="desc" font-size="14.5" fill="#9aa1ad">Runs the network before the upscaler,</text>
    <text x="24" y="94" class="desc" font-size="14.5" fill="#9aa1ad">at render resolution, so it costs less.</text>
    <text x="24" y="128" class="who" font-size="13" fill="#7d8592">64-bit D3D12 with DLSS of its own</text>
  </g>
</svg>
