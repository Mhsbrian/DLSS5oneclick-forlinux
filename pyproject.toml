[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlss5oneclick"
version = "0.1.0"
description = "One-click DLSS 5 neural rendering setup for games that ship without DLSS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PySide6>=6.7", "certifi"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.gui-scripts]
dlss5oneclick = "dlss5oneclick.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
